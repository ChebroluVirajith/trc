    .speaker-info h5 {

      color: #fff;
      font-weight: 600;
    }

    .speaker-info p {
      margin: 2px 0;
      color: #ccc;
      font-size: 14px;

    .call-btn {
      display: inline-flex;
      /* Align icon + text neatly */
      align-items: center;
      gap: 6px;
      /* space between icon and text */
      padding: 5px 14px;
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
      letter-spacing: 0.3px;
      transition: all 0.3s ease;
      margin-top: 6px;
      /* consistent spacing below “Head” */
    }

    .call-btn:hover {
      background: #121e33;
      color: #fff;
      box-shadow: 0 0 8px rgba(22, 35, 55, 0.5);
      transform: translateY(-2px);
    }

    /* .call-btn i {
  font-size: 15px;
  color: #02010f; /* soft pink icon color for contrast */
    /* } */
    .call-btn i {
      font-size: 15px;
      color: white;
      /* Roboveda Blue */
      transition: color 0.3s ease;
    }

    .call-btn:hover i {
      color:white;
      /* lighter blue glow on hover */
    }
  </style>
